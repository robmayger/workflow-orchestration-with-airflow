version: '3.8'

services:
  dev:
    build: .
    container_name: python_dev
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix # For GUI support (if needed)
    environment:
      - DISPLAY=${DISPLAY}
    tty: true
  airflow:
    build: .
    container_name: airflow
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    command: ["airflow", "standalone"]
